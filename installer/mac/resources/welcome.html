<h2>Dialogue Boost</h2>
<p>Louder, clearer dialogue without clipping.</p>
<p>This installs the Dialogue Boost VST3 plugin for DaVinci Resolve (and any VST3 host) into
<code>/Library/Audio/Plug-Ins/VST3</code>.</p>
<p>Close DaVinci Resolve before continuing.</p>
